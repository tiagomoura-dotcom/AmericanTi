/* Casca Android (Trusted Web Activity): abre o app publicado no GitHub Pages dentro do Chrome,
   com microfone, reconhecimento de voz, YouTube e modo offline funcionando como no navegador. */
plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.tiagomoura_dotcom.americanti'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.tiagomoura_dotcom.americanti'
        minSdk 21
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0.' + (System.getenv('VERSION_CODE') ?: '1')
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS') ?: 'americanti'
            keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
