   ex:["L:Rio is ___ than São Paulo. (hot)=hotter","L:This is the ___ restaurant in town. (good)=best","E:Qual está certa?=This phone is more cheap.|*This phone is cheaper.|This phone is more cheaper.",
    "E:Complete: My car is ___ than yours.=more old|*older|oldest","O:This is the most expensive hotel in the city","C:She is more tall than her brother.=She is taller than her brother.|She's taller than her brother."]},
  28:{exp:["agree é verbo: I agree (nunca I'm agree).",
    "So do I / So am I = eu também, concordando com uma afirmativa. Repete o auxiliar da frase: I like tea. So do I. I'm tired. So am I.",
    "Neither do I / Neither am I = eu também não, com negativas: I don't smoke. Neither do I.",
    "Para discordar com educação: I see your point, but… / I'm not sure about that."],
   ex:["L:A: I love pizza. B: So ___ I.=do","L:A: I'm not hungry. B: Neither ___ I.=am","E:Qual está certa?=I'm agree with you.|*I agree with you.|I am agreeing with you.",
    "E:A: I can't swim. B: ___=So can I.|*Neither can I.|Neither do I.","O:I see your point, but I disagree","C:A: I went to the concert. B: So do I.=So did I."]},
  29:{exp:["Algo que começou no passado e continua: I've lived here since 2015. I've been working here for three years.",
    "O português usa o presente (moro aqui desde 2015); o inglês usa o present perfect. Não diga I live here since 2015.",
    "for + período (for two years, for a long time); since + ponto de início (since 2015, since Monday, since I was a child).",
    "Pergunta: How long have you been learning English?"],
   ex:["L:I've worked here ___ 2019.=since","L:She has been studying ___ three hours.=for","E:Qual está certa?=I live in Curitiba since 2010.|*I have lived in Curitiba since 2010.|I am living in Curitiba since 2010.",
    "E:Complete: How long ___ learning English?=are you|*have you been|do you","O:How long have you been waiting?","C:We know each other for ten years.=We have known each other for ten years.|We've known each other for ten years."]},
  31:{exp:["Question tag é o “né?” do inglês: It's cold, isn't it? You like coffee, don't you?",
    "Frase afirmativa pede tag negativa; frase negativa pede tag afirmativa: She isn't here, is she?",
    "O tag repete o auxiliar: He can swim, can't he? They went, didn't they?",
    "Entonação descendo: só confirmando. Subindo: dúvida de verdade."],
   ex:["L:It's a beautiful day, ___ it?=isn't","L:You don't eat meat, ___ you?=do","E:She works here, ___?=isn't she|*doesn't she|don't she",
    "E:They went to Rio, ___?=went they|*didn't they|don't they","O:You can drive, can't you?","C:He is your brother, no?=He is your brother, isn't he?|He's your brother, isn't he?"]},
  32:{exp:["who para pessoas: The woman who lives next door is a doctor.",
    "which para coisas e animais: The book which I bought is great. that serve para os dois.",
    "Quando o pronome é objeto, dá para omitir: The book (that) I bought.",
    "Ótimo quando falta a palavra: It's a thing that you use to open bottles. It's a person who fixes cars."],
   ex:["L:A dentist is a person ___ takes care of teeth.=who|that","L:This is the phone ___ I bought yesterday.=which|that","E:Qual está certa?=The man which called you is here.|*The man who called you is here.|The man who he called you is here.",
    "E:Descrevendo um objeto:=It's a thing who you use to cut.|*It's a thing that you use to cut.|It's a thing you use it to cut.","O:She is the friend who helped me","C:The restaurant who we went to was great.=The restaurant which we went to was great.|The restaurant that we went to was great.|The restaurant we went to was great."]},
  33:{exp:["Muitas preposições não são as do português: depend on (não of), interested in (não on), good at (não in).",
    "Outras comuns: listen to, wait for, ask for, think about, worried about, afraid of, married to.",
    "Depois de preposição, o verbo vai com -ing: I'm interested in learning.",
    "Guarde a combinação inteira como um bloco: depend on, e não só depend."],
   ex:["L:It depends ___ the weather.=on","L:I'm very interested ___ history.=in","E:Qual está certa?=She is good in math.|*She is good at math.|She is good on math.",
    "E:Complete: We are waiting ___ the bus.=to|*for|by","O:He is married to a Brazilian woman","C:I'm worried with my exam.=I'm worried about my exam.|I am worried about my exam."]},
  34:{exp:["1ª condicional (real, futuro): If + presente, will: If it rains, I'll stay home.",
    "2ª (imaginária, presente): If + passado, would: If I had money, I would travel. Não diga If I would have.",
    "3ª (passado que não aconteceu): If + had + particípio, would have: If I had known, I would have come. Na fala: I'd've.",
    "Na 2ª, com be, use were: If I were you, I'd take the job."],
   ex:["L:If it ___ tomorrow, we'll cancel the trip. (rain)=rains","L:If I ___ rich, I would buy a house on the beach. (be)=were|was","E:Qual está certa?=If I would know, I would tell you.|*If I knew, I would tell you.|If I know, I would tell you.",
    "E:Complete: If she had studied, she ___ the exam.=would pass|*would have passed|will pass","O:What would you do if you won the lottery?","C:If I will see him, I will tell him.=If I see him, I will tell him.|If I see him, I'll tell him."]},
  35:{exp:["Ordinais: first, second, third, fourth, fifth… twenty-first. Nos EUA o mês vem antes: 05/10 é 10 de maio.",
    "Anos: 1998 = nineteen ninety-eight; 2024 = twenty twenty-four.",
    "Vírgula separa milhares e ponto marca decimais: 1,500 = one thousand five hundred; 2.5 = two point five.",
    "hundred, thousand e million não vão para o plural depois de número: two hundred people (não two hundreds)."],
   ex:["L:My birthday is on March ___. (3)=third|3rd","L:There were three ___ people at the concert. (mil)=thousand","E:Como se diz 1,200?=one thousand and two hundreds|*one thousand two hundred|one point two hundred",
    "E:Nos EUA, 04/07 é:=4 de julho|*7 de abril","O:The meeting is on the twenty-first of June","C:Two millions people live there.=Two million people live there."]},
  36:{exp:["say não leva a pessoa direto; tell leva: He said (that) he was tired. He told me (that) he was tired. Nunca He said me.",
    "explain também não: Explain it to me (não Explain me).",
    "O tempo verbal costuma recuar um passo: “I am busy” → She said she was busy; “I will call” → He said he would call.",
    "Pedidos: She asked me to wait. Perguntas: He asked where I lived (sem do, na ordem da afirmação)."],
   ex:["L:She ___ me she was sick.=told","L:He ___ that he was busy.=said","E:Qual está certa?=Can you explain me this?|*Can you explain this to me?|Can you explain to me this?",
    "E:“I will help you.” → He said he ___ help me.=will|*would|wills","O:She asked me to close the door","C:He said me that he was tired.=He told me that he was tired.|He told me he was tired.|He said that he was tired.|He said he was tired."]},
  37:{exp:["Muitos phrasal verbs aceitam o objeto no meio ou no fim: Turn off the light / Turn the light off.",
    "Com pronome (it, them, him), o pronome fica no meio: Turn it off (nunca turn off it). Pick it up.",
    "A força vai na partícula: pick it UP, figure it OUT.",
    "Comuns: pick up, put away, turn on/off, figure out, sort out, give back, throw away."],
   ex:["L:The music is too loud. Please turn ___ down.=it","L:I don't understand this. Can you help me figure it ___?=out","E:Qual está certa?=Pick up it.|*Pick it up.|Up pick it.",
    "E:These are your books. Please put ___.=away them|*them away|they away","O:Please give it back to me","C:I threw away it.=I threw it away."]},
  38:{exp:["Voz passiva: to be + particípio, quando quem faz não importa ou não se sabe: English is spoken here. The car was stolen.",
    "O tempo fica no to be: is made, was built, has been sold, will be announced.",
    "by mostra quem fez, quando importa: The book was written by Machado de Assis.",
    "Muito comum em notícias: Two people were injured. A new law has been approved."],
   ex:["L:This bridge ___ built in 1950.=was","L:Coffee ___ grown in Brazil.=is","E:Qual está certa?=My phone was stole.|*My phone was stolen.|My phone stolen.",
    "E:Complete: The results will ___ tomorrow.=announce|*be announced|announced","O:The windows are cleaned every week","C:The house was build in 1920.=The house was built in 1920."]},
  39:{exp:["Abrir e ordenar: first of all, to begin with, then, after that, finally.",
    "Contrastar: but, however (no começo da frase, com vírgula), although (Although it was late, we stayed).",
    "Somar e exemplificar: also, in addition, for example. Causa e consequência: because, so, that's why.",
    "Fechar: to sum up, all in all. Na fala, moreover e furthermore soam formais demais."],
   ex:["L:It was raining, ___ we stayed home.=so","L:I like my job. ___, the salary is low.=However|But","E:Qual está certa?=Although it was cold, but we went out.|*Although it was cold, we went out.|Although it was cold, so we went out.",
    "E:Para fechar uma apresentação:=First of all|*To sum up|For example","O:First of all, I want to thank you","C:I was tired, because I went to bed early.=I was tired, so I went to bed early."]},
  41:{exp:["must be: certeza de que é verdade: She's been working all day. She must be tired.",
    "can't be: certeza de que não é: That can't be Ana; she's in Paris.",
    "might, may e could: possibilidade: It might rain. He may be late.",
    "Passado: must have, might have, can't have + particípio: He must have forgotten. Para suavizar: It seems that…, I'd say…"],
   ex:["L:He hasn't eaten all day. He ___ be hungry.=must","L:That ___ be true! It's impossible.=can't|cannot","E:Talvez chova:=It must rain.|*It might rain.|It can't rain.",
    "E:Complete: The lights are off. They ___ gone out.=must|*must have|might","O:She might have missed the bus","C:He must to be at home.=He must be at home."]},
  42:{exp:["Frase clivada: What I need is a vacation. It was Maria who called (foi a Maria que ligou).",
    "do/does/did para enfatizar: I do like it! She did call you.",
    "Inversão formal depois de expressões negativas: Never have I seen… Not only is it cheap, but it's also good.",
    "Use com moderação; na conversa, a mais útil é What I mean is…"],
   ex:["L:___ I need is more time.=What","L:It was my brother ___ broke the window.=who|that","E:Ênfase com inversão:=Never I have seen this.|*Never have I seen this.|Never have seen I this.",
    "E:Ênfase em afirmativa:=I liked do it.|*I did like it.|I do liked it.","O:What I mean is that we need help","C:Not only it is cheap, but it is also fast.=Not only is it cheap, but it is also fast.|Not only is it cheap, but it's also fast."]},
  43:{exp:["Past perfect (had + particípio): algo que aconteceu antes de outro ponto do passado: When I arrived, the movie had started.",
    "Na narrativa: passado simples para a sequência, past continuous para o pano de fundo, past perfect para voltar atrás.",
    "Compare: When I got there, she left (saiu quando cheguei) × she had left (já tinha saído).",
    "Não misture presente e passado no meio da história."],
   ex:["L:By the time we arrived, the train ___ left.=had","L:She was tired because she ___ slept well. (negativa)=hadn't|had not","E:Quando cheguei, ela já tinha saído:=When I arrived, she left.|*When I arrived, she had left.|When I had arrived, she left.",
    "E:Complete: I ___ never seen snow before that trip.=have|*had|was","O:I realized I had forgotten my wallet","C:When we got to the cinema, the film already started.=When we got to the cinema, the film had already started."]},
  44:{exp:["Na fala informal, o começo da frase cai: (It) Sounds good. (Do you) Want some coffee? (I) Got it.",
    "Respostas curtas sem repetir: A: Are you coming? B: I think so. / I hope not.",
    "Substituição: I'd love to (sem repetir o verbo). I didn't want to, but I had to.",
    "Reconhecer essas formas é tão importante quanto usar; na escrita formal, use a frase completa."],
   ex:["L:A: Are you going to the party? B: I hope ___. (sim)=so","L:A: Do you want to come? B: I'd love ___!=to","E:Forma completa de “Sounds good.”:=It sound good.|*That sounds good.|Is sounds good.",
    "E:Resposta natural para “Can you help me?”:=Sure, I can help.|*Sure, I can.|Sure, I can it.","O:I didn't want to, but I had to","C:A: Is it going to rain? B: I think yes.=I think so."]},
  45:{exp:["Pergunta indireta é mais educada: Could you tell me…?, Do you know…?, I was wondering…",
    "Depois da introdução, a ordem é de afirmação, sem do/does/did: Could you tell me where the station is? (não where is the station).",
    "Sem palavra Wh, use if ou whether: Do you know if the store is open?",
    "Útil em entrevistas e no trabalho: I'd like to know what the next steps are."],
   ex:["L:Do you know ___ the bank opens on Saturdays? (se)=if|whether","L:Could you tell me how much this ___? (custa)=costs","E:Qual está certa?=Can you tell me where is the station?|*Can you tell me where the station is?|Can you tell me where does the station is?",
    "E:Qual está certa?=Do you know what time does it start?|*Do you know what time it starts?|Do you know what time starts it?","O:I was wondering if you could help me","C:Could you tell me where does she live?=Could you tell me where she lives?"]},
  46:{exp:["unless = a menos que, se não: I'll go unless it rains (= if it doesn't rain). Não use negativa depois de unless.",
    "as long as / provided that = desde que, contanto que: You can borrow my car as long as you're careful.",
    "Condicional mista, passado que afeta o presente: If I had taken that job, I would be rich now.",
    "Ou presente que explica o passado: If I were braver, I would have said something."],
   ex:["L:We'll have the meeting outside ___ it rains.=unless","L:You can go out ___ long as you come back before midnight.=as","E:Qual está certa?=I won't go unless you don't come.|*I won't go unless you come.|I won't go unless you will come.",
    "E:Passado que afeta o presente:=If I had studied medicine, I would have been a doctor now.|*If I had studied medicine, I would be a doctor now.|If I studied medicine, I would have been a doctor now.",
    "O:I will lend you the money as long as you pay me back","C:Unless you don't hurry, you'll miss the bus.=Unless you hurry, you'll miss the bus.|Unless you hurry, you will miss the bus."]},
  47:{exp:["used to: hábito ou estado do passado que acabou: I used to live in Recife. I used to have long hair.",
    "would: só para ações repetidas no passado, comum em histórias: Every summer we would go to the beach. Não use would para estados.",
    "Negativa e pergunta: I didn't use to… Did you use to…? (sem o d).",
    "Hábito de hoje usa o presente com usually: I usually wake up early (não I use to wake up early)."],
   ex:["L:I ___ to smoke, but I quit five years ago.=used","L:Did you ___ to play soccer as a child?=use","E:Hábito de hoje:=I use to drink coffee every morning.|*I usually drink coffee every morning.|I used to drink coffee every morning now.",
    "E:Estado no passado:=I would have a dog when I was a kid.|*I used to have a dog when I was a kid.|I use to have a dog when I was a kid.","O:We used to go to the beach every summer","C:When I was a child, I use to play outside.=When I was a child, I used to play outside."]}
};

  {apos:2, t:'Conhecendo alguém', tema:'Apresentações, países e profissões',
   falas:["A: Hi, I'm Laura. What's your name?","B: Hi, Laura. I'm Pedro. Nice to meet you.","A: Nice to meet you too. Where are you from, Pedro?","B: I'm from Brazil, from Belo Horizonte. And you?","A: I'm from Canada. I'm a nurse. What do you do?","B: I'm an engineer. I work for a car company.","A: Oh, nice! Is this your first time in London?","B: Yes, it is. It's a beautiful city."],

  {apos:4, t:'A família do Pedro', tema:'Família e casa',

   dit:["This is my mother.","She's twenty-three.","He lives in Lisbon with his wife."]},
  {apos:6, t:'Rotina e horários', tema:'Rotina, horários e hobbies',

   dit:["I get up at six thirty.","What time do you start work?","On weekends I sleep late."]},
  {apos:8, t:'Pedindo direções', tema:'Cidade e direções',

   q:["E:Where is the pharmacy?=*On Green Street|On Bank Street|Next to the hospital","E:What do you do after two blocks?=Turn right|*Turn left|Go back","E:How far is it?=Fifteen minutes by bus|*About five minutes on foot|Two kilometers"],
   dit:["Is there a pharmacy near here?","Go straight for two blocks and turn left.","It's about five minutes on foot."]},
  {apos:12, t:'Numa loja de roupas', tema:'Compras, tamanhos e preços',
   falas:["A: Hi, can I help you?","B: Yes, I'm looking for a jacket. Something warm for the winter.","A: What size are you?","B: Medium, I think.","A: How about this one? It's very popular.","B: It's nice, but I don't really like the color. Do you have it in black?","A: Yes, here you are. The fitting rooms are over there.","B: Thanks. How much is it?","A: It's eighty-nine dollars, but it's twenty percent off this week."],
   q:["E:What is B looking for?=A shirt|*A warm jacket|Black shoes","E:What color does B want?=Blue|*Black|White","E:What is the discount this week?=Ten percent|*Twenty percent|Eighty-nine dollars"],
   dit:["I'm looking for a jacket.","Do you have it in black?","The fitting rooms are over there."]},
  {apos:14, t:'Entrevista rápida', tema:'Trabalho e habilidades',

   q:["E:What does B do?=*Graphic designer|Engineer|Teacher","E:Which languages can B speak?=Only Spanish|*Spanish and Portuguese|French and Spanish","E:When can't B work?=On Saturdays|*On Sundays|On Mondays"],
   dit:["Can you speak Spanish?","I can't work on Sundays.","We often have big projects on Saturdays."]},
  {apos:16, t:'Planos de férias', tema:'Planos e férias',
   falas:["A: Are you going to travel in July?","B: Yes! I'm going to visit my cousins in Chile. We're going to ski in the mountains.","A: Wow. How long are you going to stay?","B: Two weeks. And you? Any plans?","A: Not yet. Maybe I'll go to the beach. I don't know.","B: You should go to Florianópolis. It's beautiful.","A: Good idea. I think I'll look for flights tonight."],
   q:["E:Where is B going?=*To Chile|To Florianópolis|To Mexico","E:How long is B going to stay?=One week|*Two weeks|One month","E:What is A going to do tonight?=Visit cousins|*Look for flights|Go to the beach"],
   dit:["I'm going to visit my cousins.","How long are you going to stay?","I think I'll look for flights tonight."]},
  {apos:18, t:'No hotel', tema:'Viagem: aeroporto, hotel e transporte',
   falas:["A: Good evening. Do you have a reservation?","B: Yes, my name is Lucas Ferreira. I have a reservation for three nights.","A: Let me check. Yes, a double room until Friday. Can I see your passport, please?","B: Sure, here it is. What time is breakfast?","A: From six thirty to ten. The restaurant is on the first floor.","B: And how far is the hotel from the city center?","A: About ten minutes by taxi. There's also a bus stop across the street.","B: Perfect, thank you."],
   q:["E:How many nights is the reservation for?=Two|*Three|Five","E:What time does breakfast end?=At six thirty|*At ten|At eleven","E:How far is the city center?=*About ten minutes by taxi|An hour by bus|Five minutes on foot"],
   dit:["I have a reservation for three nights.","What time is breakfast?","There's also a bus stop across the street."]},
  {apos:22, t:'Chuva nas montanhas', tema:'Contar uma história',
   falas:["Last year I was traveling in Peru with two friends.","One afternoon, we were walking in the mountains when it suddenly started to rain.","We didn't have umbrellas, so we ran to a small house.","An old woman opened the door and invited us in.","While we were drinking hot tea, she was telling us stories about the village.","In the end, the rain stopped and we walked back to the hotel.","It was the best day of the trip."],
   q:["E:Where were they traveling?=In Chile|*In Peru|In Bolivia","E:What happened while they were walking?=They got lost|*It started to rain|They met some friends","E:What did the old woman do?=She sold umbrellas|*She invited them in|She called a taxi"],
   dit:["We were walking in the mountains when it suddenly started to rain.","We didn't have umbrellas.","It was the best day of the trip."]},
  {apos:24, t:'Primeiro dia no trabalho', tema:'Regras e obrigações no trabalho',
   falas:["A: So, it's your first day. Any questions?","B: Yes. Do I have to wear a suit?","A: No, you don't have to. Smart casual is fine. But you must wear your ID badge all the time.","B: Okay. What about working hours?","A: You have to be here at nine, but you can leave at five thirty. And you mustn't use your personal phone during meetings.","B: Got it. Do I need to bring my own laptop?","A: No, we'll give you one this afternoon."],
   q:["E:Does B need to wear a suit?=Yes|*No|Only on Mondays","E:What must B wear all the time?=A tie|*An ID badge|A uniform","E:What is forbidden during meetings?=Drinking coffee|*Using a personal phone|Using laptops"],
   dit:["Do I have to wear a suit?","You must wear your ID badge all the time.","We'll give you one this afternoon."]},
  {apos:26, t:'Pedindo conselho', tema:'Problemas do dia a dia e conselhos',
   falas:["A: You look stressed. What's wrong?","B: I'm working too much and I can't sleep. I don't know what to do.","A: You should talk to your boss. Maybe you could work from home on Fridays.","B: That's a good idea. Actually, I should have asked last month.","A: And you shouldn't drink coffee after six. That helps me a lot.","B: I wish I had more time for exercise, too.","A: Why don't you walk to work? It's only twenty minutes."],
   q:["E:What is B's problem?=*B works too much and can't sleep|B hates the boss|B is bored","E:What does A suggest about Fridays?=Taking the day off|*Working from home|Going to the gym","E:What does A say about coffee?=*Don't drink it after six|Drink more of it|Drink tea instead"],
   dit:["You should talk to your boss.","I should have asked last month.","I wish I had more time for exercise."]},
  {apos:28, t:'Curitiba ou Porto Alegre?', tema:'Comparar cidades e dar opinião',
   falas:["A: So, which city is better to live in, Curitiba or Porto Alegre?","B: In my opinion, Curitiba is cleaner and safer. But it's colder, too.","A: I agree, but Porto Alegre is cheaper, isn't it?","B: A little. Rent is more expensive in Curitiba.","A: And the food? I think Porto Alegre has the best barbecue in the country.","B: I see your point, but that's a matter of taste.","A: Fair enough."],

const diaNum = () => Math.floor(Date.parse(hoje() + 'T12:00:00') / 86400000);
const semanaAtual = () => Math.floor((diaNum() + 3) / 7);
const nivelAtual = () => moduloDa(proximaAula());
function videoDoDia(){
  const m = nivelAtual();
  const lista = VIDEOS_DIA.filter(v => v.m === m);
  const pulo = store.get('video:pulo', {})[hoje()] || 0;
  const i = (diaNum() + pulo) % lista.length;
  return {lista, i, v:lista[i]};
}
function musicaDaSemana(){
  const sem = semanaAtual();
  const escolhida = store.get('musica:escolha', {})[sem];
  const doNivel = MUSICAS.filter(s => s.m === nivelAtual());
  const s = MUSICAS.find(x => x.k === escolhida) || doNivel[sem % doNivel.length];
  return {s, sem};
}

/* Dias de estudo, para a sequência e o plano do dia */
function registrarAtividade(tipo){
  const d = store.get('dias', {});
  const h = hoje();
  d[h] = d[h] || [];
  if (d[h].includes(tipo)) return;
  d[h].push(tipo);
  const chaves = Object.keys(d).sort();
  while (chaves.length > 400) delete d[chaves.shift()];
  store.set('dias', d);
}
function sequencia(){
  const d = store.get('dias', {});
  let dia = hoje(), n = 0;
  if (!(d[dia] || []).length) dia = somarDias(dia, -1);
  while ((d[dia] || []).length){ n++; dia = somarDias(dia, -1); }
  return n;
}

/* Player do YouTube da imersão: conta os minutos assistidos e pula vídeos que não abrem aqui */
const imersao = {player:null, timer:null};
function contarImersao(ligar){
  if (ligar && !imersao.timer){
    imersao.timer = setInterval(() => {
      const r = store.get('imersao:seg', {});
      r[hoje()] = (r[hoje()] || 0) + 5;
      const chaves = Object.keys(r).sort();
      while (chaves.length > 90) delete r[chaves.shift()];
      store.set('imersao:seg', r);
      if (r[hoje()] >= 60) registrarAtividade('video');
      const barra = $('#imProg'), txt = $('#imMin');
      if (barra) barra.style.width = Math.min(100, Math.round(r[hoje()] / META_IMERSAO * 100)) + '%';
      if (txt) txt.textContent = `${Math.floor(r[hoje()] / 60)} de 20 minutos hoje`;
    }, 5000);
  }
  if (!ligar && imersao.timer){ clearInterval(imersao.timer); imersao.timer = null; }
}

      },
      onStateChange: ev => contarImersao(ev.data === 1)
    }});
    imersao.player = player;
  });
}

REGRAS DO TEXTO

SE VOCÊ NÃO TIVER ACESSO AO REPOSITÓRIO
Gere um único arquivo JSON chamado <id>.lib.json, em UTF-8, exatamente neste formato (versão 1):

${JSON.stringify(modelo, null, 2)}

Detalhes obrigatórios:
- "s" do parágrafo: "p" (normal), "h" (subtítulo), "q" (citação/carta) ou "li" (item de lista).
- "tr" do parágrafo (obrigatório): a tradução para português do Brasil de CADA frase do parágrafo, na ordem, como [início, fim, "tradução"]; início/fim são posições de caracteres da frase dentro de "t" (fim exclusivo). As frases cobrem o parágrafo inteiro, sem sobreposição. Títulos e itens de lista também levam "tr". A tradução é natural e fiel, não palavra por palavra.
- "forms": TODAS as palavras que aparecem no texto, como estão escritas (plurais, verbos conjugados e palavras com maiúscula no início de frase), apontando para uma entrada de "entries". Chaves: "W:" + lema em minúsculas, ou "N:" + nome próprio.
- "entries": uma por lema, com "pt" (tradução com os sentidos usados no livro), "def" (definição simples em inglês, opcional para palavras muito básicas), "pos" (noun, verb, adj, adv, name, pron, prep, conj, det, interj) e "cat" ("verb" para verbos, "word" para o resto). Use "img" em pessoas reais, lugares, navios e objetos concretos, com o termo exato de busca na Wikipédia em inglês.
- "occ" das expressões: [capítulo, parágrafo, início, fim], posições em caracteres dentro do texto do parágrafo (a partir de 0; o fim não é incluído). Inclua phrasal verbs ("type": "phrasal") e expressões fixas ("type": "expression").
- "grammar": use estes ids, nesta ordem de aprendizagem: ${ORDEM_GRAMATICA.join(', ')}. "occ" = [capítulo, parágrafo, início, fim, início da frase, fim da frase]. Marque até 4 exemplos por tópico em cada capítulo, apenas exemplos corretos. Inclua somente os tópicos que aparecem no livro.

}

function importarExtra(p){
  if (typeof p.chave !== 'string' || !/^(video|musica|livro):/.test(p.chave)){ aviso('Arquivo inválido: o campo chave não foi reconhecido.'); return false; }

  const origem = typeof p.origem === 'string' && p.origem ? p.origem : p.chave;
  const todos = store.get('extras', {});
  const reimportacao = !!todos[p.chave];
  p.importadaEm = new Date().toISOString();
  todos[p.chave] = p;

  guardarVocabulario(p.vocabulario, origem);
  store.set('erros', guardarErros(p.erros, origem, !reimportacao).cad);

const NOME_TRILHA = {gramatica:'Gramática', escuta:'Escuta', escrita:'Escrita'};
const ORDEM_TRILHA = {gramatica:0, escuta:1, escrita:2};
function exCompacto(s){
  const tipo = s[0], corpo = s.slice(2);
  const k = corpo.indexOf('=');
  const a = k < 0 ? corpo : corpo.slice(0, k), b = k < 0 ? '' : corpo.slice(k + 1);
  if (tipo === 'L') return {tipo:'lacuna', frase:a, resposta:b.split('|')};
  if (tipo === 'C') return {tipo:'corrigir', frase:a, resposta:b.split('|')};
  if (tipo === 'O') return {tipo:'ordenar', resposta:a};
  const ops = b.split('|');
  return {tipo:'escolha', pergunta:a, opcoes:ops.map(o => o.replace(/^\*/, '')), resposta:Math.max(0, ops.findIndex(o => o[0] === '*'))};
}
function treino(id){
  const m = /^([gew])(\d+)$/.exec(String(id || ''));
  if (!m) return null;
  const k = +m[2];
  if (m[1] === 'g'){
    const e = aulaEmenta(k);
    if (!e) return null;
    const revisao = /^Checkpoint/.test(e.som);
    const titulo = k === 0 ? 'Teste de nível de gramática' : revisao ? `Revisão de gramática do módulo ${e.modulo}` : e.gramatica;
    return {id:m[0], trilha:'gramatica', n:k, apos:k, modulo:e.modulo, titulo, revisao:revisao || k === 0, dados:GRAMATICA[k] || null};
  }
  const lista = m[1] === 'e' ? ESCUTAS : ESCRITAS;
  const d = lista[k - 1];
  if (!d) return null;
  return {id:m[0], trilha:m[1] === 'e' ? 'escuta' : 'escrita', n:k, apos:d.apos, modulo:moduloDa(d.apos), titulo:d.t, dados:d};
}
function idsTreino(trilha){
  if (trilha === 'gramatica') return EMENTA.map(x => 'g' + x[0]);
  if (trilha === 'escuta') return ESCUTAS.map((_, i) => 'e' + (i + 1));
  return ESCRITAS.map((_, i) => 'w' + (i + 1));
}
function todosOsTreinos(){
  return ['gramatica', 'escuta', 'escrita'].flatMap(idsTreino).map(treino)
    .sort((a, b) => a.apos - b.apos || ORDEM_TRILHA[a.trilha] - ORDEM_TRILHA[b.trilha]);
}
const treinosDaAula = n => todosOsTreinos().filter(t => t.apos === n);
const praticasSalvas = () => store.get('praticas', {});
function exerciciosGramatica(t){
  if (t.dados) return t.dados.ex.map(exCompacto);
  const unidades = Object.keys(GRAMATICA).map(Number);
  if (t.n === 0) return [1, 2, 3, 4, 5].flatMap(m => embaralhar(unidades.filter(x => moduloDa(x) === m)).slice(0, 3)
    .map(x => { const ex = GRAMATICA[x].ex; return exCompacto(ex[Math.floor(Math.random() * ex.length)]); }));
  return embaralhar(unidades.filter(x => moduloDa(x) === t.modulo).flatMap(x => GRAMATICA[x].ex)).slice(0, 12).map(exCompacto);
}
function montarTreino(t){
  const imp = praticasSalvas()[t.id] || {};
  let ex = [], dit = [];
  if (t.trilha === 'gramatica') ex = exerciciosGramatica(t);
  else if (t.trilha === 'escuta'){ ex = t.dados.q.map(exCompacto); dit = t.dados.dit.slice(); }
  else ex = t.dados.ex.map(exCompacto);
  return {exercicios:ex.concat(imp.exercicios || []), ditado:dit.concat(imp.ditado || []), midia:imp.midia || [],
    vocabulario:imp.vocabulario || [], erros:imp.erros || [], notas:imp.notas || '', imp};
}
function rotuloOrigem(o){
  if (typeof o !== 'string') return 'Aula ' + o;
  const t = treino(o);
  return t ? `${NOME_TRILHA[t.trilha]}: ${t.titulo}` : o;
}
function tagTreino(t){
  const r = resultados(t.id);
  if (r.concluida) return {tag:'Concluído', cls:' done'};
  if (r.exercicios !== undefined) return {tag:r.exercicios + '%', cls:''};
  if (praticasSalvas()[t.id]) return {tag:'Importado', cls:''};
  return {tag:'', cls:''};
}
function proximosTreinos(n, max){
  return todosOsTreinos().filter(t => t.apos <= n && !resultados(t.id).concluida).slice(0, max);
}

/* Escuta: o diálogo é lido com duas vozes quando o aparelho tem mais de uma */
function tocarDialogo(falas, rate){
  if (!temVoz){ aviso('Este navegador não tem leitura em voz alta.'); return; }
  leitor.tocando = false;
  leitor.token++;
  const ocupado = speechSynthesis.speaking || speechSynthesis.pending;
  speechSynthesis.cancel();
  const vozes = vozesIngles();
  const vA = vozEscolhida();
  const vB = (vA && (vozes.find(v => v.voiceURI !== vA.voiceURI && v.lang === vA.lang) || vozes.find(v => v.voiceURI !== vA.voiceURI))) || vA;
  const ler = () => falas.forEach(f => {
    const m = /^([A-Z]):\s*(.*)$/.exec(f);
    const quem = m ? m[1] : 'A';
    const u = new SpeechSynthesisUtterance(m ? m[2] : f);
    const v = quem === 'B' ? vB : vA;
    if (v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    if (quem === 'B' && vB === vA) u.pitch = 1.3;
    u.rate = rate;
    speechSynthesis.speak(u);
  });
  if (ocupado) setTimeout(ler, 80); else ler();
}

/* Escrita: checklist e contagem de palavras */
function contarPalavrasTexto(s){ return (String(s).match(/[A-Za-zÀ-ÿ0-9’']+/g) || []).length; }
function avaliarEscrita(t, texto){
  const s = String(texto).toLowerCase().replace(/[’‘]/g, "'");
  const itens = [[`Pelo menos ${t.dados.min} palavras`, contarPalavrasTexto(texto) >= t.dados.min]];
  t.dados.checks.forEach(([d, re, min]) => itens.push([d, (s.match(re) || []).length >= (min || 1)]));
  return itens;
}
function htmlChecklist(t, texto, conferido){
  return avaliarEscrita(t, texto).map(([d, ok]) => `<li class="${conferido ? (ok ? 'ok' : 'no') : ''}">${conferido ? (ok ? '✓ ' : '✗ ') : ''}${esc(d)}</li>`).join('');
}
function checarEscrita(){
  const ta = $('#textoEscrita');
  if (!ta || !estadoAula || !estadoAula.t) return;
  if (!ta.value.trim()){ aviso('Escreva seu texto antes de conferir.'); return; }
  const itens = avaliarEscrita(estadoAula.t, ta.value);
  $('#checklist').innerHTML = htmlChecklist(estadoAula.t, ta.value, true);
  const ok = itens.filter(x => x[1]).length;
  salvarResultado(estadoAula.t.id, 'checklist', Math.round(ok / itens.length * 100));
  registrarAtividade('treino');
  aviso(ok === itens.length ? 'Checklist completo. Agora copie o prompt e peça a correção ao Claude.' : `${ok} de ${itens.length} itens do checklist.`);
}

function gerarPromptTreino(t, texto){

function copiarTexto(txt){
  const box = $('#promptBox');
  if (box){ box.value = txt; box.hidden = false; }
  const manual = () => { if (box){ box.focus(); box.select(); } aviso('Selecione o texto da caixa e copie.'); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(() => aviso('Prompt copiado. Cole no chat com o Claude.'), manual);
  } else manual();
}

/* Importação de uma aula de prática feita no chat */
function importarPratica(p){
  const t = treino(p.unidade);
  if (!t){ aviso('Aula de prática inválida: o campo unidade não corresponde a nenhum treino do app.'); return false; }
  const erro = validarListas(p);
  if (erro){ aviso('Aula de prática inválida: ' + erro); return false; }
  for (const k of ['texto_corrigido', 'comentario', 'notas']) if (p[k] !== undefined && typeof p[k] !== 'string') { aviso(`Aula de prática inválida: o campo ${k} deve ser texto.`); return false; }
  const todas = praticasSalvas();
  const reimportacao = !!todas[t.id];
  p.importadaEm = new Date().toISOString();
  todas[t.id] = p;
  store.set('praticas', todas);
  guardarVocabulario(p.vocabulario, t.id);
  store.set('erros', guardarErros(p.erros, t.id, !reimportacao).cad);
  aviso(`${NOME_TRILHA[t.trilha]} importada: ${(p.exercicios || []).length} exercícios e ${(p.erros || []).length} erros.`);
  telaAtual = '';
  ir('#treino/' + t.id);
  return true;
}

function acao(nome, el){
  const d = el.dataset;
  switch (nome){
    case 'importar-aula': abrirImportador('Importar aula', 'Cole aqui o JSON que o Claude gerou no fim da aula, ou escolha um arquivo .json.'); break;

    case 'percep-resp': percepResponder(+d.k); break;
    case 'media-play': tocarMidia(+d.mi); break;

    case 'dit-devagar': falar(estadoAula.a.ditado[+d.di], {rate:0.6}); break;
    case 'dit-conferir': conferirDitado(+d.di); break;
    case 'rep-ouvir': falar(estadoAula.a.ditado[+d.ri]); break;
    case 'rep-gravar': alternarGravacao(+d.ri, el); break;
    case 'rep-minha': { const u = estadoAula.grav[+d.ri]; if (u) new Audio(u).play().catch(() => aviso('Não foi possível tocar a gravação.')); break; }
    case 'rep-testar': testarFala(+d.ri); break;
    case 'ex-conferir': conferirTexto(+d.xi); break;
    case 'ex-escolha': responderEscolha(+d.xi, +d.oi); break;
    case 'ex-palavra': estadoAula.ord[+d.xi].push(+d.wi); atualizarOrdem(+d.xi); break;
    case 'ex-tirar': estadoAula.ord[+d.xi].splice(+d.pos, 1); atualizarOrdem(+d.xi); break;
    case 'ex-limpar': estadoAula.ord[+d.xi] = []; atualizarOrdem(+d.xi); break;
    case 'ex-ordenar': conferirOrdem(+d.xi); break;
    case 'concluir-aula':
      salvarResultado(estadoAula.n, 'concluida', true);
      if (proximaAula() <= estadoAula.n) store.set('aula:alvo', Math.min(48, estadoAula.n + 1));

      telaAtual = '';

    case 'errei': responderCartao(false); break;
    case 'acertei': responderCartao(true); break;
    case 'err-conferir': conferirErro(+d.ei); break;
    case 'copiar-prompt-treino': {

      if (t) copiarTexto(gerarPromptTreino(t, t.trilha === 'escrita' ? store.get('texto:' + t.id, '') : ''));

      telaAtual = '';

      store.set('video:visto', v);
      registrarAtividade('video');

    }
    case 'musica-prompt': copiarTexto(gerarPromptMusica()); break;

      const f = store.get('musica:feita', {});

      rota();

      e[semanaAtual()] = d.k;
      store.set('musica:escolha', e);
      telaAtual = '';
      rota();

      break;

        el.textContent = `Baixando… ${feitos + falhas + 1} de ${feitos + falhas + ids.length}`;
        carregarLivro(ids.shift()).then(() => feitos++, () => falhas++).then(proximo);
      };
      proximo();
      break;
    }
    case 'vocab-toggle': {
      const it = folha.itens[+d.k];
      if (!it) break;
      alternarVocab(it);
      el.outerHTML = botaoVocab(+d.k);
      break;
    }
    case 'vocab-lista': {
      const it = folha.itens[+d.k];
      if (!it) break;
      alternarVocab(it);
      telaAtual = '';
      rota();

    }

    case 'vocab-ordem': store.set('vocab:alfa', !store.get('vocab:alfa', true)); telaAtual = ''; rota(); break;

    }

      const b = livroPorId(location.hash.split('/')[1]);

      store.set('leitor:gramatica', !store.get('leitor:gramatica', false));
      telaAtual = '';
      rota();
      break;
    case 'clube-prompt': {
      const b = leitor.livro;
      if (b) copiarTexto(gerarPromptClube(b, leitor.cap));
      break;

    case 'video-add': {
      const url = $('#vUrl').value.trim();
      const id = idYouTube(url);
      if (!id){ aviso('Não reconheci esse link do YouTube.'); break; }
      let inicio = 0;
      try { inicio = segundos(String(new URL(url).searchParams.get('t') || '').replace(/s$/, '').replace(/(\d+)m(\d+)/, '$1:$2')); } catch(e) {}
      const meus = store.get('videos:meus', []);
      meus.unshift({id, titulo:$('#vTitulo').value.trim(), inicio:inicio || 0});
      store.set('videos:meus', meus);
      aviso('Vídeo adicionado.');
      telaAtual = '';
      rota();
      break;
    }
    case 'video-del': {
      const meus = store.get('videos:meus', []);
      meus.splice(+d.i, 1);
      store.set('videos:meus', meus);
      telaAtual = '';
      rota();
      break;
    }
  }
}

let telaAtual = '';
function rota(){
  const h = decodeURIComponent(location.hash.replace(/^#/, '')) || 'hoje';
  if (h === telaAtual) return;
  const saiuDoLeitor = telaAtual.startsWith('ler/');
  telaAtual = h;
  if (temVoz && !leitor.aposCapitulo){
    if (saiuDoLeitor) leitor.tocando = false;
    leitor.token++;
    speechSynthesis.cancel();
  }
  pararGravacao();
  contarImersao(false);
  imersao.player = null;
  $('#sheet').hidden = true;

  const partes = h.split('/');
  const view = $('#view');
  let aba = partes[0];
  let noLeitor = false;

  const bLivro = (partes[0] === 'livro' || partes[0] === 'ler') ? livroPorId(partes[1]) : null;
  if (!bLivro && (partes[0] === 'livro' || partes[0] === 'ler') && !ricosProntos){
    view.innerHTML = `<p class="empty">Abrindo o livro…</p>`;
    aba = 'biblioteca';
  } else if (bLivro && !bLivro.chapters){
    /* Livro com arquivo próprio ainda não carregado: baixa e volta para esta mesma tela */
    view.innerHTML = `<button class="back" data-go="#biblioteca">${ICON.back}Biblioteca</button><p class="empty">Abrindo ${esc(bLivro.title)}…</p>`;
    aba = 'biblioteca';
    carregarLivro(bLivro.id).then(() => { telaAtual = ''; rota(); })
      .catch(() => { if (telaAtual === h) view.innerHTML = `<button class="back" data-go="#biblioteca">${ICON.back}Biblioteca</button><p class="empty">Não consegui abrir este livro. Abra com internet uma vez; depois ele fica salvo para ler sem internet.</p>`; });
  } else if (partes[0] === 'livro'){
    const b = bLivro;
    if (!b){ location.hash = '#biblioteca'; return; }
    view.innerHTML = telaLivro(b);
    aba = 'biblioteca';
  } else if (partes[0] === 'ler'){
    const b = bLivro;
    const ci = Math.max(0, (parseInt(partes[2], 10) || 1) - 1);
    if (!b || ci >= b.chapters.length){ location.hash = '#biblioteca'; return; }
    leitor.livro = b; leitor.cap = ci;
    store.set('leitura:ultimo', b.id);
    registrarAtividade('leitura');
    view.innerHTML = telaLeitor(b, ci);
    noLeitor = true;
    aba = 'biblioteca';
    const p = progresso(b.id);
    const inicio = (p && p.cap === ci && !p.lido) ? p.frase : 0;
    leitor.idx = Math.min(inicio, leitor.frases.length - 1);
    if (!p || p.lido || p.cap !== ci) salvarProgresso(b.id, ci, 0, p && p.lido);
    montarBarraAudio();
    window.scrollTo(0, 0);
    if (leitor.aposCapitulo){
      leitor.aposCapitulo = false;
      tocarDe(0);
    } else if (inicio > 0) marcarFrase(inicio, 'here');
  } else if (partes[0] === 'aulas'){
    view.innerHTML = telaAulas();
  } else if (partes[0] === 'aula'){
    const n = parseInt(partes[1], 10);
    if (!(n >= 0 && n <= 48)){ location.hash = '#aulas'; return; }
    const a = aulasSalvas()[n] || null;
    prepararAula(n, a || {});
    view.innerHTML = telaAula(n, a);
    aba = 'aulas';
  } else if (partes[0] === 'pratica'){
    if (partes[1] === 'videos' || partes[1] === 'podcasts'){ location.hash = '#imersao/' + partes[1]; return; }
    view.innerHTML = telaPratica(partes[1] || 'gramatica');
  } else if (partes[0] === 'imersao'){
    const sec = partes[1] || 'hoje';
    if (sec === 'musica'){
      const {s} = musicaDaSemana();
      const imp = store.get('extras', {})['musica:' + s.k] || {};
      prepararAula('musica:' + s.k, {exercicios:imp.exercicios || []});
    }
    view.innerHTML = telaImersao(sec);
    depoisDeImersao(sec);
  } else if (partes[0] === 'treino'){
    const t = treino(partes[1]);
    if (!t){ location.hash = '#pratica'; return; }
    const a = montarTreino(t);
    prepararAula(t.id, a);
    estadoAula.t = t;
    view.innerHTML = telaTreino(t, a);
    aba = 'pratica';
  } else if (partes[0] === 'revisao'){
    if (partes[1] === 'cartoes'){ iniciarSessao(); view.innerHTML = telaCartoes(); }
    else if (partes[1] === 'erros') view.innerHTML = telaCaderno();
    else view.innerHTML = telaRevisao();
    aba = 'revisao';
  } else if (partes[0] === 'biblioteca' && (partes[1] === 'gramatica' || partes[1] === 'vocabulario')){
    view.innerHTML = `<header class="page-head"><h1>Biblioteca</h1></header>${abasBiblioteca(partes[1])}<p class="empty">Carregando…</p>`;
    (partes[1] === 'gramatica' ? telaGramaticaLivros(partes[2]) : telaVocabularioLivros()).then(html => {
      if (telaAtual !== h) return;
      view.innerHTML = html;
      const f = document.getElementById('foco');
      if (f) f.scrollIntoView({block:'start'});
    });
  } else if (partes[0] === 'biblioteca'){
    view.innerHTML = telaBiblioteca();
  } else {
    view.innerHTML = telaHoje();
    aba = 'hoje';
  }
  if (!noLeitor){ $('#audiobar').hidden = true; window.scrollTo(0, 0); }
  $('#nav').hidden = noLeitor;
  document.documentElement.style.setProperty('--reader-size', store.get('fonte', 1.15) + 'rem');
  document.querySelectorAll('.nav button').forEach(btn => {
    if (btn.dataset.tab === aba) btn.setAttribute('aria-current', 'page'); else btn.removeAttribute('aria-current');
  });
}
function ir(hash){
  location.hash = hash;
  rota();
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener('click', e => {
  const t = e.target;

  const navBtn = t.closest('.nav button');
  if (navBtn){ ir('#' + navBtn.dataset.tab); return; }

  const go = t.closest('[data-go]');
  if (go){ ir(go.dataset.go); return; }

  const act = t.closest('[data-act]');
  if (act){ acao(act.dataset.act, act); return; }

  const card = t.closest('.book-card');
  if (card){
    if (card.dataset.ok === '1') ir('#livro/' + card.dataset.book);
    else aviso('Este livro ainda não foi adaptado. Peça a adaptação no chat.');
    return;
  }

  const rm = t.closest('[data-remove]');
  if (rm){
    const imp = store.get('livros:importados', {});
    delete imp[rm.dataset.remove];
    store.set('livros:importados', imp);
    if (livrosRicos[rm.dataset.remove]){ delete livrosRicos[rm.dataset.remove]; idbApagar(rm.dataset.remove).catch(() => {}); }
    aviso('Livro removido.');
    ir('#biblioteca');
    return;
  }

  const ouvir = t.closest('[data-listen]');
  if (ouvir){
    const id = location.hash.split('/')[1];
    const ci = parseInt(ouvir.dataset.listen, 10);
    ir(`#ler/${id}/${ci + 1}`);
    tocarDe(leitor.idx);
    return;
  }

  const ler = t.closest('[data-read]');
  if (ler){
    const id = decodeURIComponent(location.hash.split('/')[1]);
    const ci = parseInt(ler.dataset.read, 10);
    if (leitor.tocando) pausar();
    ir(`#ler/${id}/${ci + 1}`);
    return;
  }

  if (t.closest('#btnConcluir')){
    if (leitor.livro){
      pausar();
      salvarProgresso(leitor.livro.id, leitor.cap, 0, true);
      aviso('Livro concluído.');
      ir('#livro/' + leitor.livro.id);
    }
    return;
  }

  if (t.closest('#fontMais') || t.closest('#fontMenos')){
    let f = store.get('fonte', 1.15);
    f = t.closest('#fontMais') ? Math.min(1.6, f + 0.1) : Math.max(0.9, f - 0.1);
    f = Math.round(f * 100) / 100;
    store.set('fonte', f);
    document.documentElement.style.setProperty('--reader-size', f + 'rem');
    return;
  }

  const palavra = t.closest('.w');
  if (palavra && leitor.livro && leitor.livro.rico){ abrirPalavra(palavra); return; }

  const g = t.closest('.g');
  if (g){
    const termo = g.dataset.t;
    const sheet = $('#sheet');
    sheet.innerHTML = `<div><div class="term">${esc(g.textContent)}</div><div class="meaning">${esc(leitor.significado[termo] || '')}</div></div><button class="close" aria-label="Fechar">×</button>`;
    sheet.hidden = false;
    return;
  }
  if (t.closest('#sheet .close')){ $('#sheet').hidden = true; return; }

  const frase = t.closest('.s');
  if (frase){
    const i = parseInt(frase.dataset.i, 10);
    if (leitor.tocando) tocarDe(i);
    else {
      leitor.idx = i;
      marcarFrase(i, 'here');
      if (leitor.livro) salvarProgresso(leitor.livro.id, leitor.cap, i);
    }
    return;
  }

  if (t.closest('#btnPlay')){
    if (leitor.tocando) pausar(); else tocarDe(leitor.idx);
    return;
  }

  if (t.closest('#btnVel')){
    const atual = store.get('velocidade', 0.9);
    const prox = VELOCIDADES[(VELOCIDADES.indexOf(atual) + 1) % VELOCIDADES.length] || 0.9;
    store.set('velocidade', prox);
    $('#btnVel').textContent = rotuloVelocidade(prox);
    if (leitor.tocando) tocarDe(leitor.idx);
    return;
  }

  if (!t.closest('#sheet')) $('#sheet').hidden = true;
});

document.addEventListener('change', e => {
  if (e.target.id === 'selVoz'){
    store.set('voz', e.target.value);
    if (leitor.tocando) tocarDe(leitor.idx);
  }
});

/* Importar arquivo: aula, livro ou backup */
$('#importFile').addEventListener('change', async e => {
  const arq = e.target.files[0];
  e.target.value = '';
  if (!arq) return;
  const obj = lerJSON(await arq.text());
  if (!obj){ aviso('Arquivo inválido: não é um JSON.'); return; }
  if (importarObjeto(obj)) fecharImportador();
});
function validarLivro(b){
  if (!b || typeof b !== 'object') return 'o conteúdo não é um livro.';
  for (const campo of ['id', 'title', 'author']) if (typeof b[campo] !== 'string' || !b[campo].trim()) return `falta o campo ${campo}.`;
  if (!Number.isInteger(b.module) || b.module < 1 || b.module > 5) return 'o campo module deve ser de 1 a 5.';
  if (!Array.isArray(b.chapters) || !b.chapters.length) return 'falta a lista chapters.';
  for (const c of b.chapters){
    if (typeof c.title !== 'string' || !Array.isArray(c.paragraphs) || !c.paragraphs.every(p => typeof p === 'string')) return 'há um capítulo sem title ou paragraphs.';
    if (c.glossary && (!Array.isArray(c.glossary) || !c.glossary.every(g => g && typeof g.term === 'string' && typeof g.meaning === 'string'))) return 'há um glossário com formato errado.';
  }
  return null;
}

/* Leitor de livro rico: selecionar um trecho mostra a tradução das frases */
let selTimer = null, ultimaSel = '';
document.addEventListener('selectionchange', () => {
  clearTimeout(selTimer);
  selTimer = setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !leitor.livro || !leitor.livro.rico || !telaAtual.startsWith('ler/')) { ultimaSel = ''; return; }
    const no = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
    if (!no || !no.closest('.chapter') || no.closest('#sheet')) return;
    const txt = sel.toString().trim();
    if (!txt || txt === ultimaSel || txt.split(/\s+/).length < 2) return;
    ultimaSel = txt;
    abrirSelecao(sel);
  }, 700);
});

window.addEventListener('hashchange', rota);
rota();

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
